name: CI

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:
    inputs:
      mark_unusable:
        description: '在 Release 标题标注 [功能无法使用][待修复]'
        type: boolean
        default: false
        required: false

# Regular pushes/PRs build signed APKs as run artifacts only. Releases are
# created exclusively from version tags, and a tag is never released twice -
# old releases and their notes are never overwritten (alpha.1 lesson).
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build release APKs (per-ABI + universal, signed with CI keystore)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace --warning-mode all

      - name: Check APK signatures
        run: |
          ls -la app/build/outputs/apk/release/
          for apk in app/build/outputs/apk/release/*.apk; do
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk"
          done

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v5
        with:
          name: NekoPort-APKs
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  release:
    # Only version tags produce a GitHub Release. Every release is a fresh
    # tag => a fresh release; nothing is ever overwritten after the fact.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download built APKs
        uses: actions/download-artifact@v5
        with:
          name: NekoPort-APKs
          path: apk

      - name: Verify tag matches versionName
        run: |
          VERSION=$(grep -oP 'baseVersionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          if [ -z "$VERSION" ]; then
            echo "::error::could not read baseVersionName from app/build.gradle.kts"
            exit 1
          fi
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" != "$TAG_VERSION" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match baseVersionName $VERSION - cut the tag from the matching commit."
            exit 1
          fi

      - name: Refuse to overwrite an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "::error::release $GITHUB_REF_NAME already exists - never overwrite; cut a new tag."
            exit 1
          fi

      - name: Prepare release notes
        run: |
          MARKER=""
          if [ "${{ inputs.mark_unusable }}" = "true" ]; then
            MARKER="[功能无法使用][待修复] "
          fi
          cat > RELEASE_NOTES.md <<'NOTES_EOF'
          > ⚠️ Alpha 预览版，界面与功能仍会调整，欢迎通过 [Issues](https://github.com/masgzy/NekoPort/issues) 反馈问题。

          ## 🛠 安全与修复（0.1.0-alpha.6）

          ### 供应链
          - 组件下载强制 HTTPS（UI 校验 + 下载通道统一收口 + Manifest 禁用明文流量）；镜像索引与 .deb 分别加 32 MB / 256 MB 体积上限，异常响应不再能撑爆内存
          - .deb 内符号链接目标逃出安装前缀时拒绝解包（防路径穿越；此前的重写逻辑会漏判 `..`）
          - 系统云备份/换机迁移（D2D）补充排除 config.json、runtime/ 与 sites/
          - 文件分享（FileProvider）不再暴露整个 cache 目录，仅开放明确声明的子路径

          ### FTP
          - **修复任何账户都无法登录（421）**：pure-ftpd 的 `-A` chroot 在 Android 应用 uid 下必然失败（无 CAP_SYS_CHROOT，登录时直接断开）。移除该参数，改为应用层路径限制
          - 拒绝把 FTP 根目录指向应用敏感路径（配置文件、运行时目录等）
          - FTP 主端口不允许落在自身被动端口段内（此前可保存，保存后 pure-ftpd 起不来）

          ### MySQL（MariaDB）
          - **用户自设的 root 密码不再被启动流程清空**：启动时检测认证插件，仅对旧的 unix_socket 数据目录做一次性修复；自设密码记录标记并永久保留
          - 开启远程访问（0.0.0.0）前弹出风险确认（空密码 + 全网监听 = 数据库裸奔）
          - 新增「设置 root 密码」入口

          ### Apache
          - **修复全部站点无法启动（P0）**：LoadModule 写成 `mod_<name>_module.so`，而 Termux 包内真实文件名为 `mod_<name>.so`，15 条加载指令全部落空

          ### 进程与稳定性
          - 应用被系统杀死后遗留的服务进程（表现为重启后端口占用、状态错乱）：启动时按 /proc 扫描并清理孤儿进程与过期 pid 文件
          - config.json 损坏时保留现场（`config.json.corrupt-<时间戳>`）并自动回滚 `.bak`；保存改为临时文件 + fsync + 原子重命名
          - 启动日志按会话限高（8 MB），不再无限增长
          - 文件编辑对话框改为 IO 线程读取内容（最多 256 KB 的同步读取不再卡住弹窗）

          ### 配置与 UI
          - 新增全局「仅本机监听」开关：Web 服务 / FTP / MariaDB 绑定 127.0.0.1；新建站点默认关闭目录列表
          - 站点设置保存时若存在用户自定义配置文件，弹窗询问是否删除（此前自定义配置优先，改动端口等设置不会生效）
          - 定时任务：编辑表达式后立即重新调度（此前按旧表达式触发）；新建任务不再立即触发一次
          - 检查更新按版本号比较（epoch + 数字段），回滚到旧版本不再误报「有更新」
          - 文档根指向存储根目录时提示 open_basedir 风险

          ## 📦 安装
          - 按设备架构下载对应 APK：**armv8a**（arm64-v8a，绝大多数现代手机）、**armv7**、**x86-64**、**x86**，或下载 **universe** 全架构包
          - 系统要求 Android 8.0+；首次使用需联网安装服务器组件（约 50-100 MB）
          - 遇到「启动失败」请长按卡片上的错误信息复制后提交 Issue，便于定位
          NOTES_EOF
          # Prepend the broken-release marker when requested.
          if [ -n "$MARKER" ]; then
            sed -i "1s/^/# ${MARKER}NekoPort ${GITHUB_REF_NAME#v}\n/" RELEASE_NOTES.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: apk/*.apk
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
