name: CI

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK (signed with CI keystore)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace --warning-mode all

      - name: Check APK signature
        run: |
          ls -la app/build/outputs/apk/release/
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs app/build/outputs/apk/release/*.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NekoPort-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Prepare release notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cat > RELEASE_NOTES.md <<'NOTES_EOF'
          > ⚠️ Alpha 预览版，界面与功能仍会调整，欢迎通过 [Issues](https://github.com/masgzy/NekoPort/issues) 反馈问题。

          ## 🐛 修复

          - **卡死与闪退（重点）**：全部服务启停操作移入后台线程，修复「新建站点点保存卡死」「点启动卡死」「开启 MySQL 闪退」「开启 FTP 闪退」四大问题——此前这些阻塞操作（进程等待、端口轮询、数据库初始化）都跑在主线程上
          - MariaDB 数据目录引导改用自带 bash 执行并加 120 秒超时，失败原因写入日志并显示在界面
          - FTP 虚拟用户创建（pure-pw）加超时保护，输出全程记录
          - 应用日志页与编辑器页：标题不再被状态栏遮挡；按返回键退出当前界面而不是退出应用
          - 编辑器有未保存修改时，返回/关闭会先弹「保存 / 放弃 / 取消」确认
          - 全局异常兜底：崩溃堆栈写入 runtime/logs/crash.log，应用日志落盘持久化，重启后可回看

          ## ✨ 新特性

          ### 仪表盘（底栏最左）
          - 一屏总览 6 个组件的运行状态与版本（Lighttpd · Nginx · Apache · PHP-FPM · MariaDB · Pure-FTPd），点击直达对应管理面板；未安装的组件提供安装入口
          - 站点信息卡：地址后带 **[<>]** 浏览器预览按钮，地址点击即复制；显示站点根目录，提供「打开文件夹 / 编辑文件」快捷入口（文件页支持 `..` 上级目录导航与内部存储浏览）
          - 站点卡「编辑」按钮直达站点编辑弹窗；「配置文件 / 日志文件」入口默认隐藏，点「更多」展开
          - 「运行全部服务」开关：启动所有已启用站点、FTP 与 MySQL，并在通知栏保持常驻

          ### 管理（合并 MySQL / FTP / 计划任务）
          - 底栏收敛为 5 个标签：仪表盘 / 站点 / 管理 / 文件 / 设置
          - 「管理」页集中管理 Lighttpd / Nginx / Apache / PHP / MySQL / FTP / 计划任务七个面板（KSWEB 式组件页布局：开关 → 设置 → 配置文件 → 日志文件）
          - 站点页不再堆放 PHP 卡片与组件卡片

          ### 代码编辑器（参照 Acode 重做）
          - 编辑器内核换用 **CodeMirror**（Acode 同款，MIT），交互模型对齐 Acode 并已在关于页声明来源
          - 行号、语法高亮（nginx / ini / sh / php / html / css / js / yaml）、当前行高亮、括号匹配
          - 查找与替换（含大小写开关、全部替换）、跳转到行、字号缩放（10-20，持久化）、撤销重做
          - 底部符号栏（按文件类型）+ TAB 键；Ln/Col · UTF-8 · 行数 · 已修改/已保存 状态栏
          - 多文件标签页，脏标记与未保存防护

          ### 组件按需装卸
          - 设置 → 服务器组件：每个组件可单独 **安装 / 更新 / 卸载**（含依赖闭包解析与文件清单）；卸载保留共享依赖与 MariaDB 数据目录
          - 站点自定义根目录：可将文档根指向内部存储（如 `/sdcard/htdocs`），首次使用引导存储权限；PHP 的 open_basedir 自动同步

          ### 其它
          - 全局按压动效：按钮按下 scale(0.96) 物理压缩 + 深度内阴影，释放弹簧轻微超调回弹
          - FTP 首次启动自动生成随机密码（不再使用固定默认密码）
          - 设置新增「忽略电池优化」引导，保活更稳

          ## 🛠 改进
          - 引擎顺序遵循 KSWEB 习惯：Lighttpd → Nginx → Apache
          - 应用日志改为 O(1) 写入并落盘（runtime/logs/app.log），应用日志页重启不丢
          - 版本探测改为缓存，消除每 4 秒在主线程拉起 6+ 子进程的轮询风暴
          - 每 4 秒的页面轮询合并为单一全局轮询（仅内存查询，后台线程）
          - Termux 镜像源：官方源 / 官方 CF 源 / CERNET / 清华 / 北大 / 北外 / 中科大 / 南大 / 阿里云 / 腾讯云默认展示，其余（华为云、高校镜像、自定义）收入「更多」

          ## 📦 安装
          - 下载下方 APK（正式签名）；系统要求 Android 8.0+，支持 arm64-v8a / armeabi-v7a / x86_64
          - 首次使用需联网安装服务器组件（约 50-100 MB），国内网络建议先在「设置 → 软件源镜像」中选择就近镜像
          NOTES_EOF

      - name: Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
