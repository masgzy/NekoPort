name: CI

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:
    inputs:
      mark_unusable:
        description: '在 Release 标题标注 [功能无法使用][待修复]'
        type: boolean
        default: false
        required: false

# Regular pushes/PRs build signed APKs as run artifacts only. Releases are
# created exclusively from version tags, and a tag is never released twice -
# old releases and their notes are never overwritten (alpha.1 lesson).
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build release APKs (per-ABI + universal, signed with CI keystore)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace --warning-mode all

      - name: Check APK signatures
        run: |
          ls -la app/build/outputs/apk/release/
          for apk in app/build/outputs/apk/release/*.apk; do
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk"
          done

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v7
        with:
          name: NekoPort-APKs
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  release:
    # Only version tags produce a GitHub Release. Every release is a fresh
    # tag => a fresh release; nothing is ever overwritten after the fact.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download built APKs
        uses: actions/download-artifact@v7
        with:
          name: NekoPort-APKs
          path: apk

      - name: Verify tag matches versionName
        run: |
          VERSION=$(grep -oP 'baseVersionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          if [ -z "$VERSION" ]; then
            echo "::error::could not read baseVersionName from app/build.gradle.kts"
            exit 1
          fi
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" != "$TAG_VERSION" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match baseVersionName $VERSION - cut the tag from the matching commit."
            exit 1
          fi

      - name: Refuse to overwrite an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "::error::release $GITHUB_REF_NAME already exists - never overwrite; cut a new tag."
            exit 1
          fi

      - name: Prepare release notes
        run: |
          MARKER=""
          if [ "${{ inputs.mark_unusable }}" = "true" ]; then
            MARKER="[功能无法使用][待修复] "
          fi
          cat > RELEASE_NOTES.md <<'NOTES_EOF'
          > ⚠️ Alpha 预览版，界面与功能仍会调整，欢迎通过 [Issues](https://github.com/masgzy/Nekoport/issues) 反馈问题。

          ## 🛠 修复（0.1.0-alpha.9）—— 第三方审计 V1-V20 全量修复

          ### 数据库安全
          - **开启局域网访问强制要求 root 密码**：此前开启「允许局域网访问」只弹一次确认框，root 默认空密码意味着同一 Wi-Fi 下任何人无需凭据即可接管数据库；现在必须先设置非空 root 密码才能开启，且启动时服务端二次校验（检测到无密码的局域网配置会自动回退为仅本机监听）
          - **root 密码改经 MYSQL_PWD 环境变量传递**：此前 ALTER USER 的密码随命令行参数传递，同 uid 的任意进程（如被攻破的 WordPress）可从 /proc 读取；环境变量不进 argv，堵住该泄露链

          ### FTP 与凭据
          - **FTP 密码与 Cron 命令加密存储**：config.json 中的 FTP 账户密码、定时任务命令改为 Android Keystore AES-256-GCM 加密（enc:v1: 前缀），旧明文配置自动兼容并在下次保存时自动加密；读取应用沙箱不再等于拿到全部凭据

          ### 供应链
          - **镜像 URL 严格解析**：拒绝 userinfo 伪装（https://trusted.example@evil.example/）、非 https、无有效主机名等写法，设置页与服务端双重校验
          - **重定向逐跳校验**：下载器不再自动跟随重定向（此前只校验第一跳的 https），改为手动跟随、每一跳重复 https/主机校验、最多 3 跳
          - **下载包强制 SHA256 校验**：镜像索引中的 SHA256 字段必验，不匹配即中止安装并删除文件（此前只看 ELF 魔数，任意伪造的二进制都会被执行）；Filename 字段做路径规范化，拒绝 ..、绝对路径等越界写法
          - **自动修复不再静默**：运行时组件损坏时自动重装的行为会发出通知告知用户修复了哪些组件

          ### 配置生成与注入
          - **修复 php-fpm 配置注入（关键）**：站点目录（docRoot）此前未校验也未加引号直接拼入池配置——一个换行即可注入任意池指令（如清空 security.limit_extensions 关闭 php2shell 防护、把 open_basedir 改成 /）；现在保存时校验（拒绝换行/引号/反斜杠/冒号），生成时全部值加引号转义，旧配置自动净化
          - **修复含空格路径被截断**：/sdcard/My Documents 类目录此前会把 open_basedir 截断成 /sdcard/My，站点莫名打不开，现已正确支持

          ### 稳定性与竞态
          - **服务生命周期全部串行化**：站点/FTP/数据库的启停统一收敛到全局互斥锁，消除「改配置后服务按旧配置运行」「看门狗误判反复重启」等竞态
          - **stopAll 改为等待而非静默跳过**：并发调用（定时重启 vs 手动总开关）此前第二个调用直接返回、一个进程都不停，随后启动撞端口；现在排队等待，且强杀后等待内核确认退出（避免 Address already in use）
          - **看门狗改逐组件健康检查**：此前只看「全部停摆」，单站点崩溃、php-fpm 挂掉（PHP 站点全 502）都不会修复；现在只重启 enabled 且确实挂掉的组件，并尊重用户手动停止的站点
          - **定时重启尊重手动停止**：RESTART_SERVICES 任务不再无视用户停止状态强行拉起服务
          - **START_STICKY 重建尊重用户停止**：进程被杀后系统自动重建服务时不再无条件拉起全部服务

          ### 文件管理
          - **浏览加边界**：从站点根「..」一路向上可进应用私有目录（config.json、runtime/、数据库），误删 runtime 会导致全部数据丢失；现在浏览范围限定在站点根/站点目录/内部存储内，越界目录给出提示
          - **应用内部文件只读保护**：config.json、runtime/ 等内部文件不再提供删除/重命名/分享入口
          - **分享改走安全缓存目录**：FileProvider 此前把整个 /sdcard 映射为可共享路径；现在先复制到 cache/share 再分享，任意可读文件均可分享且授权面收窄
          - **分享失败原因可区分**：「读取或复制失败」与「无接收应用」分开提示

          ### 编辑器
          - **保存改为原子写 + 自动备份**：直接 writeText 会先清空线上文件，App 中途被杀/掉电则站点文件截断损坏；现在 tmp + fsync + rename（与配置文件同规格），并保留一份 .bak
          - **只读保护下沉到数据边界**：此前只读仅靠隐藏保存按钮，WebView 内任意 JS 可直接调 NekoEditor.save() 覆写只读文件；现在 Kotlin 层与 JS 层双重拒绝

          ### Cron
          - **命令输出加上限**：logcat/备份类命令的无界输出此前会吃掉数百 MB 内存直接 OOM 闪退（连带全部服务器）；现在保留首尾各 128 KB、中间截断标记
          - **超时杀整个进程树**：此前只杀 sh 本体，mysqldump/rsync 等子进程变孤儿不断累积，下轮任务还会叠加执行
          - **日志写入串行化 + rename 轮转**：并发任务的日志行不再交错/丢失
          - **跳过的触发点留下记录**：上一轮未结束导致的高频任务跳过现在有日志可查

          ### 体验与杂项
          - **仅本机监听时隐藏局域网地址**：Dashboard 此前仍展示并允许点击必然连不上的局域网地址，且与「已限制为本机」的视觉含义相反
          - **通知栏显示数据库状态**：常驻通知此前漏掉 MariaDB，数据库崩了通知依然显示运行中
          - **存储权限改实际写探针**：Android 13+ 的 READ_MEDIA_IMAGES 并不能证明 /sdcard 可写，「权限已授予但站点打不开」改为实测（创建探针文件）判定
          - **AppLog/Cron 日志轮转改 rename**，避免并发写丢日志；删除无调用的 UrlCodec 死代码
          - **CI**：升级 upload/download-artifact@v7 与 action-gh-release@v3（Node 24 运行时，消除 Node 20 弃用警告）

          ## 📦 安装
          - 按设备架构下载对应 APK：**armv8a**（arm64-v8a，绝大多数现代手机）、**armv7**、**x86-64**、**x86**，或下载 **universe** 全架构包
          - 系统要求 Android 8.0+；首次使用需联网安装服务器组件（约 50-100 MB）
          - 遇到「启动失败」请长按卡片上的错误信息复制后提交 Issue，便于定位
          NOTES_EOF
          # Prepend the broken-release marker when requested.
          if [ -n "$MARKER" ]; then
            sed -i "1s/^/# ${MARKER}NekoPort ${GITHUB_REF_NAME#v}\n/" RELEASE_NOTES.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: apk/*.apk
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
