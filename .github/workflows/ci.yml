name: CI

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:
    inputs:
      mark_unusable:
        description: '在 Release 标题标注 [功能无法使用][待修复]'
        type: boolean
        default: false
        required: false

# Regular pushes/PRs build signed APKs as run artifacts only. Releases are
# created exclusively from version tags, and a tag is never released twice -
# old releases and their notes are never overwritten (alpha.1 lesson).
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build release APKs (per-ABI + universal, signed with CI keystore)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace --warning-mode all

      - name: Check APK signatures
        run: |
          ls -la app/build/outputs/apk/release/
          for apk in app/build/outputs/apk/release/*.apk; do
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk"
          done

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v7
        with:
          name: NekoPort-APKs
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  release:
    # Only version tags produce a GitHub Release. Every release is a fresh
    # tag => a fresh release; nothing is ever overwritten after the fact.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download built APKs
        uses: actions/download-artifact@v7
        with:
          name: NekoPort-APKs
          path: apk

      - name: Verify tag matches versionName
        run: |
          VERSION=$(grep -oP 'baseVersionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          if [ -z "$VERSION" ]; then
            echo "::error::could not read baseVersionName from app/build.gradle.kts"
            exit 1
          fi
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" != "$TAG_VERSION" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match baseVersionName $VERSION - cut the tag from the matching commit."
            exit 1
          fi

      - name: Refuse to overwrite an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "::error::release $GITHUB_REF_NAME already exists - never overwrite; cut a new tag."
            exit 1
          fi

      - name: Prepare release notes
        run: |
          MARKER=""
          if [ "${{ inputs.mark_unusable }}" = "true" ]; then
            MARKER="[功能无法使用][待修复] "
          fi
          cat > RELEASE_NOTES.md <<'NOTES_EOF'
          > ⚠️ Alpha 预览版，界面与功能仍会调整，欢迎通过 [Issues](https://github.com/masgzy/Nekoport/issues) 反馈问题。

          ## 🛠 修复（0.1.0-alpha.10）—— Termux 包残留路径护栏 + 命名规范 + 数据库停止反馈

          ### APK 命名规范修正
          - **发布文件名改用 Android 标准 ABI 名**：`armv8a`→`arm64-v8a`、`armv7`→`armeabi-v7a`、`x86-64`→`x86_64`，全架构通用包 `universe`（笔误）更正为 `universal`，并已批量重命名所有历史 Release 的资产，下载页与 README 表格一致
          - 顺带升级 CI action（Node 24 运行时），消除 Node.js 20 弃用警告

          ### Termux 包残留路径护栏（本次重点）
          - **nginx 启动失败修复（Permission denied）**：内置 nginx 是 Termux 构建，其上传缓冲目录（client_body 等 5 个 temp 目录）编译期写死在 `/data/data/com.termux/...`，本应用永远无权访问，导致 nginx 起不来；现在生成的配置显式把这 5 个目录全部重定向到应用沙箱内的 runtime/run/nginx-tmp/，目录启动前自动创建
          - **Apache 启动失败修复（no launch output）**：同一根因——Termux httpd 的运行时目录（scoreboard/mutex）编译期指向 Termux 沙箱，进程在写任何 stderr 之前就静默退出；现在配置显式指定 DefaultRuntimeDir 与 Mutex 到应用沙箱目录并预创建；启动失败时错误信息会自动带上站点 ErrorLog 的末尾（此前错误只写进文件，界面上只显示「无启动输出」无法定位）
          - **com.termux 路径检测护栏**：新增 PathGuard，双层防线——
            1. 正则检测改写：配置文件（含用户自编辑/备份恢复的副本）中的 `/data/(data|user/N)/com.termux/files/usr` 等 Termux 前缀在启动前自动改写为 NekoPort 对应路径
            2. 全文匹配兜底：改写后仍含 Termux 引用的配置，拒绝启动并在站点卡片给出可读原因；所有进程启动参数做最终全文校验，杜绝「装了 Termux 才能跑」的配置混入

          ### MySQL（MariaDB）
          - **关闭不再「卡住」**：mariadbd 收到关闭信号后要刷盘，停止实际需要数秒，但界面此前没有任何反馈，开关停在原位像死机；现在点击关闭立即显示「正在停止数据库…」（仪表盘组件行同步显示），进程真正退出后开关才切到关闭
          - 启动被中断后重复点开/关闭的状态残留清理

          ## 🛠 修复（0.1.0-alpha.11）—— Apache 代理互斥锁修复

          ### Apache 启动失败修复（第二阶段）
          - **proxy mutex 修复**：alpha.10 已让 Apache 报出真实错误（AH00023/AH02478： Couldn't create the proxy mutex），根因是 Termux 构建的 mod_proxy 走旧式 API 创建互斥锁，**无视** DefaultRuntimeDir / Mutex 指令，坚持用编译期默认的相对路径 `<ServerRoot>/var/run/apache2/proxy.<pid>`，而该目录不存在
          - 现在每次启动 Apache 站点前**预创建这个编译默认目录**（runtime/var/run/apache2），互斥锁直接落在应用沙箱内；同时保留并修正 Mutex 指令（去掉引号 + 显式覆盖 proxy），双重保险
          - nginx（alpha.10 修复后用户实测已正常）、MariaDB、lighttpd 均不受影响

          ## 📦 安装
          - 按设备架构下载对应 APK：**arm64-v8a**（绝大多数现代手机）、**armeabi-v7a**、**x86_64**、**x86**，或下载 **universal** 全架构包
          - 系统要求 Android 8.0+；首次使用需联网安装服务器组件（约 50-100 MB）
          - 遇到「启动失败」请长按卡片上的错误信息复制后提交 Issue，便于定位
          NOTES_EOF
          # Prepend the broken-release marker when requested.
          if [ -n "$MARKER" ]; then
            sed -i "1s/^/# ${MARKER}NekoPort ${GITHUB_REF_NAME#v}\n/" RELEASE_NOTES.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: apk/*.apk
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
