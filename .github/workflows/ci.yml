name: CI

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:
    inputs:
      mark_unusable:
        description: '在 Release 标题标注 [功能无法使用][待修复]'
        type: boolean
        default: false
        required: false

# Regular pushes/PRs build signed APKs as run artifacts only. Releases are
# created exclusively from version tags, and a tag is never released twice -
# old releases and their notes are never overwritten (alpha.1 lesson).
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build release APKs (per-ABI + universal, signed with CI keystore)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace --warning-mode all

      - name: Check APK signatures
        run: |
          ls -la app/build/outputs/apk/release/
          for apk in app/build/outputs/apk/release/*.apk; do
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk"
          done

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v5
        with:
          name: NekoPort-APKs
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  release:
    # Only version tags produce a GitHub Release. Every release is a fresh
    # tag => a fresh release; nothing is ever overwritten after the fact.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download built APKs
        uses: actions/download-artifact@v5
        with:
          name: NekoPort-APKs
          path: apk

      - name: Verify tag matches versionName
        run: |
          VERSION=$(grep -oP 'baseVersionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          if [ -z "$VERSION" ]; then
            echo "::error::could not read baseVersionName from app/build.gradle.kts"
            exit 1
          fi
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" != "$TAG_VERSION" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match baseVersionName $VERSION - cut the tag from the matching commit."
            exit 1
          fi

      - name: Refuse to overwrite an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "::error::release $GITHUB_REF_NAME already exists - never overwrite; cut a new tag."
            exit 1
          fi

      - name: Prepare release notes
        run: |
          MARKER=""
          if [ "${{ inputs.mark_unusable }}" = "true" ]; then
            MARKER="[功能无法使用][待修复] "
          fi
          cat > RELEASE_NOTES.md <<'NOTES_EOF'
          > ⚠️ Alpha 预览版，界面与功能仍会调整，欢迎通过 [Issues](https://github.com/masgzy/NekoPort/issues) 反馈问题。

          ## 🛠 修复（0.1.0-alpha.5）

          ### MySQL（MariaDB）：ERROR 1698 的真正修复，PHP 空密码连接从此可用
          - alpha.4 的 `--protocol=socket` 方案无效：MariaDB 的 unix_socket 认证插件会比对**对端进程的操作系统用户名**（官方 auth_socket.c 源码），Android 应用 uid 解析出的 `u0_aXXX` 永远不等于 `root`，socket / TCP 都会被拒。本轮两层修复：
          - **新数据目录**：初始化时加 `--auth-root-authentication-method=normal`，直接创建 mysql_native_password + 空密码的 root@localhost
          - **旧数据目录**：启动时自动修复——临时以 `--skip-grant-tables --skip-networking`（仅本地 socket，不暴露网络）拉起实例，把 root@localhost 切换为 mysql_native_password 空密码，随后恢复正常实例；PHP 的 mysqli/PDO 用空密码连 127.0.0.1 一次成功

          ### 定时任务（Cron）
          - `0/30` 这类「单值+步长」表达式按标准 cron 语义在 :00 与 :30 触发（此前只在 :00）
          - 命令执行加 120 秒超时并全量收集输出：挂起的命令不再永久占用任务槽位；长输出不再被提前关闭的管道 SIGPIPE 杀死（此前表现为退出码 141 的「莫名失败」）
          - 「检查表达式」改为逐日扫描：永不触发的表达式（如 `30 2 31 2 *`）不再卡顿数秒，并明确提示「永不触发」
          - 主开关关闭后，KEEP_ALIVE 看护任务不再把刚关掉的服务拉起来（此前 15 秒内全部重启，像是「关不掉」）

          ### FTP
          - 删除账户现在真正从用户数据库移除（此前只增不删，被删账户的旧凭证仍可登录）
          - 被动端口段超出 65535 时保存前即提示（此前 pure-ftpd 直接起不来且无提示）；FTP 端口与站点 / MySQL / 被动段互查重
          - 多账户编辑器状态错位修复：删除中间账户后其余输入框不再串位，保存不会把 A 的用户名密码写进 B

          ### 配置生成与安全
          - Apache `<DirectoryMatch>` 的文档根按正则转义：含 `.` 的路径不再扩大匹配范围，含 `(`/`+` 的路径不再导致配置非法、站点起不来
          - index 文件名 / PHP 扩展名 / 禁执行目录名按 `[A-Za-z0-9._-]` 白名单过滤，引号、反斜杠不再能破坏生成的 nginx / lighttpd / php-fpm 配置
          - 系统云备份/换机迁移排除 config.json（含 FTP 明文密码）、runtime/ 与 sites/
          - Manifest 补声明 `READ_MEDIA_IMAGES`（Android 13+ 个别 ROM 上存储权限不再永久拿不到）

          ### 编辑器
          - 关闭时检查**所有**标签页的未保存改动（此前只查当前页，后台标签改动被静默丢弃）
          - 主题/字号注入只在变化时执行（此前每次敲键注入两次 JS 并触发 cm.refresh()）；关闭编辑器销毁 WebView，不再泄漏

          ### 稳定性与细节
          - 日志页同毫秒重复日志不再触发 LazyColumn「Key already used」崩溃
          - 全部子进程探测（版本、mariadb 客户端等）加超时，损坏的二进制不再让 UI 无限转圈
          - 端口探测结合进程存活判定：进程死亡、端口被其他应用占用时不再误报「已启动」
          - 「卸载全部组件」清理 logs/run/tmp/home 残留（MariaDB 数据目录按弹窗承诺保留）
          - 电池优化引导改用 `context.packageName`；universe 包 versionCode 调整为最高，从单架构包换装 universe 不再被判为降级
          - 文件管理：目录列表移出主线程（大目录不卡）；上传文件名过滤 `/` 与 `..`；重命名拒绝覆盖同名文件并给出提示
          - 依赖解析支持 `a | b` 候选；.deb 内符号链接/硬链接的绝对路径与 Termux 前缀重定向到新前缀（个别文件不再缺失）
          - 路径改写改为字节级替换，彻底移除 UTF-8 往返残余（alpha.3 病根的最后残留）
          - 仪表盘 LAN 地址随网络变化自动刷新；站点配置编辑器标题提示「自定义配置 · 优先生效」（改端口不生效的原因一目了然）

          ## 📦 安装
          - 按设备架构下载对应 APK：**armv8a**（arm64-v8a，绝大多数现代手机）、**armv7**、**x86-64**、**x86**，或下载 **universe** 全架构包
          - 系统要求 Android 8.0+；首次使用需联网安装服务器组件（约 50-100 MB）
          - 遇到「启动失败」请长按卡片上的错误信息复制后提交 Issue，便于定位
          NOTES_EOF
          # Prepend the broken-release marker when requested.
          if [ -n "$MARKER" ]; then
            sed -i "1s/^/# ${MARKER}NekoPort ${GITHUB_REF_NAME#v}\n/" RELEASE_NOTES.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: apk/*.apk
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
