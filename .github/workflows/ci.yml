name: CI

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK (signed with CI keystore)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace --warning-mode all

      - name: Check APK signature
        run: |
          ls -la app/build/outputs/apk/release/
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs app/build/outputs/apk/release/*.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NekoPort-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Prepare release notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cat > RELEASE_NOTES.md <<'NOTES_EOF'
          > ⚠️ Alpha 预览版，界面与功能仍会调整，欢迎通过 [Issues](https://github.com/masgzy/NekoPort/issues) 反馈问题。

          ## 🐛 修复（0.1.0-alpha.2）

          - **开启 MySQL / FTP 直接闪退**：前台服务补齐 Android 14+ 要求的 `dataSync` 类型声明，并对 `startForeground` 做了兜底降级；通知构建也加了防护
          - **仪表盘与管理页标签图标不显示**：Material Symbols 负坐标路径整体平移进 960×960 视口（此前内容完全落在视口外被裁剪）
          - **新建站点弹窗内容超长被截断、无法保存**：弹窗内容改为可滚动（最多 62% 屏高），保存按钮始终可达
          - **my.cnf / *.conf / *.ini 全部没有语法高亮**：修复 CodeMirror 模式解析（`findModeByName` 未加载导致的静默回退纯文本）；php-fpm.conf / my.cnf / php.ini 按 INI 语法高亮，nginx/lighttpd/Apache 配置按 nginx 语法高亮
          - **MariaDB「版本」一行点击无反应**：现在会弹出完整的 `mariadbd --version` 详情
          - **「卸载%1$s」占位符未填充**：随组件操作重构一并修复
          - **「忽略电池优化」授权后仍显示**：已忽略时自动隐藏该项，回到前台即时刷新
          - 设置页分区标题（服务器组件 / 关于等）颜色加深、左缘与卡片文字对齐；服务器组件卡片上下留白加大

          ## ✨ 新特性（0.1.0-alpha.2）

          ### 服务器组件批量操作
          - 卡片右上角新增 **全部安装 / 全部更新 / 全部卸载**；全部更新 = 强制重新拉取并解压全部组件（Termux 源始终携带最新上游构建）
          - 每个组件行右侧改为图标操作：安装（下载图标）、**更新（黄色刷新图标）**、**卸载（红色垃圾桶图标）**，节省空间

          ### FTP 多账户
          - 支持多个 FTP 账户：主账户 + 任意附加账户，各自独立用户名 / 密码 / 根目录（留空使用站点根目录，可 chroot 到 /sdcard 下的目录）
          - FTP 设置全部改为标签常显（用户名 / 密码 / 端口 / 被动起始端口 / 根目录不再"删光数值才看得出是什么字段"）

          ### 仪表盘交互
          - 点击**站点地址**直接用浏览器打开；头部 **[<>]** 文件夹按钮进入内置文件管理器浏览站点目录（不再复制地址）
          - 应用日志页新增「复制日志」，当前筛选的全部日志一键复制到剪贴板
          - 自定义软件源弹窗：预填当前源地址、显示"当前源"、校验 http(s) 前缀

          ## 📦 安装
          - 下载下方 APK（正式签名）；系统要求 Android 8.0+，支持 arm64-v8a / armeabi-v7a / x86_64
          - 首次使用需联网安装服务器组件（约 50-100 MB），国内网络建议先在「设置 → 软件源镜像」中选择就近镜像
          NOTES_EOF

      - name: Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
