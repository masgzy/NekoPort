name: CI

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:
    inputs:
      mark_unusable:
        description: '在 Release 标题标注 [功能无法使用][待修复]'
        type: boolean
        default: false
        required: false

# Regular pushes/PRs build signed APKs as run artifacts only. Releases are
# created exclusively from version tags, and a tag is never released twice -
# old releases and their notes are never overwritten (alpha.1 lesson).
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build release APKs (per-ABI + universal, signed with CI keystore)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace --warning-mode all

      - name: Check APK signatures
        run: |
          ls -la app/build/outputs/apk/release/
          for apk in app/build/outputs/apk/release/*.apk; do
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk"
          done

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v5
        with:
          name: NekoPort-APKs
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  release:
    # Only version tags produce a GitHub Release. Every release is a fresh
    # tag => a fresh release; nothing is ever overwritten after the fact.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download built APKs
        uses: actions/download-artifact@v5
        with:
          name: NekoPort-APKs
          path: apk

      - name: Verify tag matches versionName
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" != "$TAG_VERSION" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match versionName $VERSION - cut the tag from the matching commit."
            exit 1
          fi

      - name: Refuse to overwrite an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "::error::release $GITHUB_REF_NAME already exists - never overwrite; cut a new tag."
            exit 1
          fi

      - name: Prepare release notes
        run: |
          MARKER=""
          if [ "${{ inputs.mark_unusable }}" = "true" ]; then
            MARKER="[功能无法使用][待修复] "
          fi
          cat > RELEASE_NOTES.md <<'NOTES_EOF'
          > ⚠️ Alpha 预览版，界面与功能仍会调整，欢迎通过 [Issues](https://github.com/masgzy/NekoPort/issues) 反馈问题。
          >
          > ❗ 待确认：alpha.2 反馈的 HTTP 引擎（Lighttpd / Nginx / Apache）启动失败在本版加入了失败原因直显（开关下方即见、长按可复制）；如仍无法启动，请长按复制错误信息提交 Issue。本版修复的 FTP / MySQL 启动错误已在代码层面根因修复。

          ## 🛠 修复（0.1.0-alpha.3）

          ### 稳定性
          - **FTP 启用报错（pure-pw rc=1 / 链接库错误）**：pure-pw 子进程此前未注入运行时环境（`LD_LIBRARY_PATH` 等），Android 链接器找不到 `libandroid-support.so` 直接失败；现已统一注入完整环境
          - **开启 MySQL 报 `Cannot run program mariadb-install-db: error=2`**：运行时新增 `dash`（提供 `bin/sh`），`mariadb-install-db` 的解释器按 bash → 自带 sh → 系统 sh 依次回退，不再指向不存在的解释器
          - **组件版本探测/「MariaDB 版本详情」点击无反应**：`--version` 探测同样补上运行时环境；失败时回退显示已记录版本并给出修复提示
          - **损坏的旧安装无法自愈**：安装前检查关键文件（各引擎二进制、pure-pw、mariadb-install-db、bin/sh、libandroid-support/libc++），缺失时自动全量修复重装；新增 x86 (i686) 设备支持
          - **启动失败原因可见**：站点 / FTP / MariaDB 启动失败时，直接把启动日志尾部（链接器错误、配置错误等）显示在卡片上，长按即可复制，不必再对着截图 OCR
          - **错误信息长按复制**：站点状态、FTP / MySQL 错误、安装失败、版本详情等文本均可长按复制

          ### 组件管理
          - **进入设置页自动检查更新**：有更新的组件更新图标变黄色高亮（并显示「可更新至 vX.Y.Z」），无更新保持置灰
          - **「全部更新」改为「检查更新」**：由用户按组件自行更新；全部安装过程实时可见（当前包名 / 进度 / 百分比）
          - **批量操作图标化**：右上角改为 图标+小字 的紧凑工具组（全部安装 / 检查更新 / 全部卸载），不再挤一排长文字按钮

          ### 仪表盘与站点卡片
          - **站点地址按行拆分**：本机（localhost）与局域网地址各占一行，点哪一行就用浏览器打开哪个地址（此前无论点哪都打开 localhost）
          - 仪表盘卡片：删除「编辑文件」「编辑站点」「更多」；头部改为 **笔图标（编辑站点，文件夹图标左侧）+ 文件夹图标**，按钮行改为 打开文件夹 / 配置文件 / 日志
          - 站点页卡片：删除「更多」；「编辑站点」改为**笔图标放在开关左侧**

          ### 其他
          - 软件源镜像默认改为**清华源**（旧安装一次性自动迁移，官方源仍可手动选回）

          ## 📦 安装
          - 按设备架构下载对应 APK：**armv8a**（arm64-v8a，绝大多数现代手机）、**armv7**、**x86-64**、**x86**，或下载 **universe** 全架构包
          - 系统要求 Android 8.0+；首次使用需联网安装服务器组件（约 50-100 MB）
          - 遇到「启动失败」请长按卡片上的错误信息复制后提交 Issue，便于定位
          NOTES_EOF
          # Prepend the broken-release marker when requested.
          if [ -n "$MARKER" ]; then
            sed -i "1s/^/# ${MARKER}NekoPort ${GITHUB_REF_NAME#v}\n/" RELEASE_NOTES.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: apk/*.apk
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
