name: "功能建议"
description: "为 NekoPort 提出新功能或改进"
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题 / 使用场景
      placeholder: "我希望能…（说明使用场景）"
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案
  - type: checkboxes
    id: note
    attributes:
      label: 备注
      options:
        - label: 我了解本项目的原则——服务器协议使用真实二进制实现，不接受自研 HTTP/FTP/PHP
